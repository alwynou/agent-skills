sources:
  herdr:
    type: git
    repo: https://github.com/herdrdev/herdr.git
projects:
  - cfpamf-front-storehouse-manage-front
skills:
  manage-agent-skills:
    source: local
    path: skills/manage-agent-skills
    enabled: true
    targets:
      - scope: global
        agents:
          - "*"
  herdr:
    source: herdr
    path: skills/herdr
    enabled: true
    targets:
      - scope: global
        agents:
          - codex
          - claude
          - kimi-code
          - pi-agent
          - opencode
